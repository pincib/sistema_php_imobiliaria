services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pinciara_crm_app
    restart: unless-stopped
    ports:
      - "8086:80"
    volumes:
      - ./storage:/var/www/html/storage
    env_file:
      - .env
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
